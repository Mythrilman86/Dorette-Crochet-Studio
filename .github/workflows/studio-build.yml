name: Studio build
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser test dependency
        run: npm install --prefix "$RUNNER_TEMP/studio-browser" playwright@1.62.1
      - run: python3 -m pip install pypdf==6.21.4
      - name: Run complete browser regression suite
        run: xvfb-run -a env NODE_PATH="$RUNNER_TEMP/studio-browser/node_modules" STUDIO_TEST_HEADFUL=1 STUDIO_TEST_BROWSER="$(command -v google-chrome)" STUDIO_BROWSER="$(command -v google-chrome)" node scripts/test-all.mjs
      - name: Preserve synthetic Build 26 wrap diagnostics
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/v2.7.1-wrap-linux-ci' }}
        uses: actions/upload-artifact@v4
        with:
          name: build26-wrap-synthetic-diagnostics
          retention-days: 3
          if-no-files-found: warn
          path: |
            publication-test-output/Build26-layout-measurements.json
            publication-test-output/Build26-enlarged-selection-measurements.json
            publication-test-output/Build26-260-wrap-stress-measurements.json
            publication-test-output/Build26-targeted-browser-results.json
            publication-test-output/Build26-Recycle-viewport-390.png
            publication-test-output/Build26-Recycle-viewport-800.png
            publication-test-output/Build26-Recycle-viewport-1440.png
            publication-test-output/Build26-Recycle-container-110.png
            publication-test-output/Build26-Recycle-container-145.png
            publication-test-output/Build26-Recycle-container-190.png
            publication-test-output/Build26-Recycle-container-260.png
            publication-test-output/Build26-Recycle-container-480.png
            publication-test-output/Build26-Recycle-enlarged-container-110.png
            publication-test-output/Build26-Recycle-enlarged-container-145.png
            publication-test-output/Build26-Recycle-enlarged-container-190.png
            publication-test-output/Build26-Recycle-enlarged-container-260.png
            publication-test-output/Build26-Recycle-enlarged-container-480.png
            publication-test-output/Build26-Recycle-enlarged-selection-110.png
            publication-test-output/Build26-Recycle-enlarged-selection-145.png
            publication-test-output/Build26-Recycle-enlarged-selection-190.png
            publication-test-output/Build26-Recycle-enlarged-selection-260.png
            publication-test-output/Build26-Recycle-enlarged-selection-480.png
            publication-test-output/Build26-Recycle-260-wrap-stress-individual.png
            publication-test-output/Build26-Recycle-260-wrap-stress-bulk.png
      - name: Verify release tag
        if: github.ref_type == 'tag'
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./release.json").web.version) process.exit(1)'
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: studio-website
          path: dist/
          if-no-files-found: error

  android:
    needs: web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Verify runner Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
      - run: npm ci && npm run sync:android
      - run: bash gradlew assembleDebug
        working-directory: mobile/android
      - run: bash gradlew bundleRelease -PstudioPlay
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: studio-android-builds-ci-only
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios:
    needs: web
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run sync:ios
        working-directory: mobile
      - name: Compile for iOS Simulator
        run: |
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios-build CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent ios-build/Build/Products/Debug-iphonesimulator/App.app studio-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: studio-ios-simulator
          path: studio-ios-simulator.zip
          if-no-files-found: error
