// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Legacy Kotlin adapters duplicate classes merged into stdlib 1.8+.
// Restrict alignment to instrumentation dependencies; production stays unchanged.
subprojects {
    configurations.configureEach { configuration ->
        if (configuration.name.toLowerCase().contains('androidtest')) {
            configuration.resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlin' &&
                    details.requested.name in ['kotlin-stdlib-jdk7', 'kotlin-stdlib-jdk8']) {
                    details.useVersion '1.8.22'
                    details.because 'Align instrumentation-only Kotlin adapters with merged stdlib'
                }
            }
        }
    }
}
